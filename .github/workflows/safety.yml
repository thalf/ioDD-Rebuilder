name: Safety checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test, verify icons and package candidate
        shell: pwsh
        run: ./scripts/Build-Candidate.ps1
      - name: Upload reviewed-build candidate
        uses: actions/upload-artifact@v4
        with:
          name: ioDD-Rebuilder-1.1.0-candidate-win-x64
          if-no-files-found: error
          path: |
            artifacts/ioDD-Rebuilder_v1.1.0-candidate_win-x64.zip
            artifacts/ioDD-Rebuilder_v1.1.0-candidate_win-x64.zip.sha256

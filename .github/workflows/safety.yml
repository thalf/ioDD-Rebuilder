name: Safety checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Build, test, verify icons and package candidate
        shell: pwsh
        run: ./scripts/Build-Candidate.ps1
      - name: Upload reviewed-build candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ioDD-Rebuilder-1.1.0-candidate-win-x64
          if-no-files-found: error
          path: |
            artifacts/ioDD-Rebuilder_v1.1.0-candidate_win-x64.zip
            artifacts/ioDD-Rebuilder_v1.1.0-candidate_win-x64.zip.sha256
